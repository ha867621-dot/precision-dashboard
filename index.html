<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111110">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Precision Dashboard</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    html,body{margin:0;background:#111110;color:#f0efec;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    #boot{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;color:#8f8e86;font-size:14px}
    #boot i{display:block;width:34px;height:34px;margin:0 auto 14px;border-radius:50%;border:3px solid #2c2c2a;border-top-color:#3987e5;animation:s 1s linear infinite}
    @keyframes s{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div id="boot"><div><i></i>Loading Precision Dashboard…</div></div>
  <script>
  // Thin loader: the app itself is published by the reporter on the Precision to Supabase storage,
  // so design updates arrive without changing this repository.
  (async () => {
    const B = 'https://aiggbllehqxitpsmqqru.supabase.co/storage/v1/object/public/app/';
    let v = Date.now();
    try { v = (await (await fetch(B + 'version.json?t=' + Date.now(), { cache: 'no-store' })).json()).v; } catch (e) { /* use timestamp */ }
    const q = '?v=' + v;
    const html = await (await fetch(B + 'app.html' + q)).text();
    const css = document.createElement('link');
    css.rel = 'stylesheet'; css.href = B + 'styles.css' + q;
    await new Promise((r) => { css.onload = r; css.onerror = r; document.head.appendChild(css); });
    document.body.innerHTML = html;
    const load = (s) => new Promise((res, rej) => { const e = document.createElement('script'); e.src = B + s + q; e.onload = res; e.onerror = () => rej(new Error(s)); document.body.appendChild(e); });
    await load('supabase.js');
    await load('app.js');
  })().catch((e) => { const b = document.getElementById('boot'); if (b) b.textContent = 'Could not load the dashboard (' + e.message + '). Check the internet connection and pull down to retry.'; });
  </script>
</body>
</html>
